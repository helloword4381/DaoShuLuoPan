# 《道枢罗盘》Gradle 配置
# 注意：本地 Android SDK 路径通过 local.properties 或 ANDROID_HOME 指定，
# 此处不写死绝对路径，保证 CI（ubuntu-latest + android-actions/setup-android）可直接构建。

# 允许工程路径包含非 ASCII 字符（本项目位于 E:\DeepSeek Harness\工作区域\daoshu-compass）。
# AGP 默认会因中文路径直接失败；CI 路径为 ASCII，不受影响。
android.overridePathCheck=true

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
kotlin.code.style=official
ksp.incremental=true
